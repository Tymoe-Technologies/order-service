version: '3.8'

services:
  order-service:
    build: .
    container_name: order-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - tymoe-network

networks:
  tymoe-network:
    external: true
